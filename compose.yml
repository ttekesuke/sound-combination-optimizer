services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      HOST: 0.0.0.0
      PORT: 9111
      SOUND_LIBRARY_MANIFEST: /app/data/library/manifest.csv
    volumes:
      - ./data/library:/app/data/library
    ports:
      - "9111:9111"

  web:
    build:
      context: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"
